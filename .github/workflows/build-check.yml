name: QADA Build Check
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:legal-sources
      - run: npm run test:legal-guard
      - run: npm run test:legal-ui-safety
      - run: npm run test:auth-consistency
      - run: npm run test:api-auth
      - run: npm run test:privacy-storage
      - run: npm run test:multimodal-evidence
      - run: npm run test:production-readiness
      - run: npm run test:blueprint-map
      - run: npm run test:interaction-wiring
      - run: npm run build
      - run: npm run audit:prod
