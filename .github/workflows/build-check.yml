name: QADA Build Check
on:
  pull_request:
    branches: [master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:legal-sources
      - run: npm run test:legal-guard
      - run: npm run test:legal-ui-safety
      - run: npm run test:auth-consistency
      - run: npm run test:api-auth
      - run: npm run test:privacy-storage
      - run: npm run build
