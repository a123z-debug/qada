name: QADA Production Readiness Smoke
on:
  workflow_dispatch:
jobs:
  production-readiness:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed readiness endpoint
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/qada-health.json -w "%{http_code}" "https://promptmaster-nine.vercel.app/api/health")
          cat /tmp/qada-health.json
          echo
          echo "HTTP=$code"
          test "$code" = "200"
          grep -q '"ready":true' /tmp/qada-health.json
          grep -q '"authConfigured":true' /tmp/qada-health.json
          grep -q '"dataConfigured":true' /tmp/qada-health.json
          grep -q '"geminiConfigured":true' /tmp/qada-health.json
          grep -q '"redisReachable":true' /tmp/qada-health.json
