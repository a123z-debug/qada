name: Smoke Auth Configuration
on:
  push:
    branches: [master]
jobs:
  auth-config:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Vercel production deployment
        run: sleep 25
      - name: Verify auth configuration
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/auth-health.json -w "%{http_code}" "https://promptmaster-nine.vercel.app/api/session?health=1")
          cat /tmp/auth-health.json
          echo
          echo "HTTP=$code"
          test "$code" = "200"
          grep -q '"authConfigured":true' /tmp/auth-health.json
