name: Smoke Admin Auth
on:
  push:
    branches: [master]
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -sS -o /tmp/body -w "%{http_code}" https://promptmaster-nine.vercel.app/api/admin-auth)
          cat /tmp/body
          echo
          test "$code" = "401"
          grep -q '"authenticated":false' /tmp/body
