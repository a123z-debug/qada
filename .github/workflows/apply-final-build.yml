name: Apply final Osool Al-Qadaa build

on:
  push:
    branches:
      - master
    paths:
      - '.deploy-payload/trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct deployment package
        shell: bash
        run: |
          set -euo pipefail
          cat .deploy-payload/chunk* | tr -d '\n\r' | base64 -d > /tmp/promptmaster-mobile-final.zip
          rm -rf /tmp/promptmaster-final
          mkdir -p /tmp/promptmaster-final
          unzip -q /tmp/promptmaster-mobile-final.zip -d /tmp/promptmaster-final
          test -f /tmp/promptmaster-final/package.json
          test -f /tmp/promptmaster-final/src/App.tsx
          test -f /tmp/promptmaster-final/server.ts

      - name: Apply final project files
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.deploy-payload/' \
            /tmp/promptmaster-final/ ./
          rm -rf .deploy-payload

      - name: Commit final build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi
          git commit -m "Deploy final Osool Al-Qadaa mobile design"
          git push origin HEAD:master
