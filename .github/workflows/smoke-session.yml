name: Smoke Session Endpoint
on:
  push:
    branches: [master]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production alias
        run: sleep 15
      - name: Verify unauthenticated session response
        shell: bash
        run: |
          set -e
          code=$(curl -sS -o /tmp/body -w "%{http_code}" https://promptmaster-nine.vercel.app/api/session)
          echo "HTTP=$code"
          cat /tmp/body
          echo
          test "$code" = "401"
          grep -q '"authenticated":false' /tmp/body
